name: Build Windows Zig prebuilt

on:
  push:
    branches:
      - fix/windows-zig-prebuilt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zig:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout pinned godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: d7b6162249ed52796a8301d216c24ee71d68c2bf
          path: godot-cpp

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install SCons
        shell: pwsh
        run: python -m pip install "scons==4.4.0"

      - name: Install pinned Zig
        shell: pwsh
        run: |
          $version = "0.16.0"
          $url = "https://ziglang.org/download/$version/zig-x86_64-windows-$version.zip"
          $expected = "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e"
          Invoke-WebRequest -Uri $url -OutFile zig.zip
          $actual = (Get-FileHash zig.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Zig archive SHA256 mismatch: $actual" }
          Expand-Archive zig.zip -DestinationPath tools
          $zig = (Get-ChildItem tools -Filter zig.exe -Recurse | Select-Object -First 1).FullName
          if (-not $zig) { throw "zig.exe not found" }
          if ((& $zig version).Trim() -ne $version) { throw "Wrong Zig version" }
          "GODOT_CPP_ZIG=$zig" >> $env:GITHUB_ENV
          "GODOT_CPP_ZIG_TARGET=x86_64-windows-gnu" >> $env:GITHUB_ENV
          "ZIG_GLOBAL_CACHE_DIR=$env:GITHUB_WORKSPACE\zig_cache" >> $env:GITHUB_ENV
          "ZIG_LOCAL_CACHE_DIR=$env:GITHUB_WORKSPACE\zig_cache" >> $env:GITHUB_ENV

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            .scons_cache
            zig_cache
          key: godot-cpp-zig-0.16.0-windows-gnu-single-d7b6162-api4.7-v2

      - name: Build godot-cpp with Zig
        shell: pwsh
        env:
          SCONS_CACHE: ${{ github.workspace }}\.scons_cache
        run: |
          foreach ($target in @("template_debug", "template_release")) {
            python -m SCons `
              -f ci/SConstruct.zig `
              api_version=4.7 `
              platform=windows `
              arch=x86_64 `
              target=$target `
              precision=single `
              use_mingw=yes `
              use_static_cpp=no `
              lto=none `
              -j2
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Package Zig prebuilt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          python scripts/package.py `
            --source godot-cpp `
            --output dist/godot-cpp-api-4.7-windows-x86_64-zig-single.zip `
            --api-version 4.7 `
            --godot-cpp-sha d7b6162249ed52796a8301d216c24ee71d68c2bf `
            --variant windows-x86_64-zig `
            --compiler zig-0.16.0-windows-gnu `
            --platform windows `
            --arch x86_64 `
            --precision single

      - name: Upload Zig prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-cpp-api-4.7-windows-x86_64-zig-single
          path: dist/godot-cpp-api-4.7-windows-x86_64-zig-single.zip
          if-no-files-found: error
