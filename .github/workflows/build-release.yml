name: Build and release godot-cpp

on:
  workflow_dispatch:
    inputs:
      api_version:
        description: Godot API version
        required: true
        default: "4.7"
        type: string
      godot_cpp_ref:
        description: Upstream godot-cpp branch, tag, or commit
        required: true
        default: "d7b6162249ed52796a8301d216c24ee71d68c2bf"
        type: string
      publish_release:
        description: Publish GitHub Release
        required: true
        default: true
        type: boolean
      release_tag:
        description: Optional exact release tag
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      short_sha: ${{ steps.upstream.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Checkout upstream godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: ${{ inputs.godot_cpp_ref }}
          path: godot-cpp

      - name: Resolve upstream revision
        id: upstream
        shell: bash
        run: |
          sha="$(git -C godot-cpp rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Verify requested API exists
        shell: bash
        run: |
          set -euo pipefail
          api="${{ inputs.api_version }}"
          api="${api/./-}"
          file="godot-cpp/gdextension/extension_api-${api}.json"

          if [ ! -f "$file" ]; then
            echo "Requested Godot API file was not found: $file"
            exit 1
          fi

          python - "$file" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          precision = data.get("header", {}).get("precision")
          if precision != "single":
              raise SystemExit(f"Expected bundled API to be single precision, got: {precision!r}")
          print("Bundled API precision:", precision)
          PY

  double_api:
    name: Generate double-precision Godot API
    needs: resolve
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Godot source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ inputs.api_version }}-stable
          path: godot
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin
          python -m pip install "scons==4.10.1"

      - name: Install AccessKit SDK
        id: accesskit
        shell: bash
        run: |
          cd godot
          if python misc/scripts/install_accesskit.py; then
            echo "enabled=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed; building without AccessKit."
            echo "enabled=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore double Godot cache
        uses: actions/cache@v4
        with:
          path: godot/.scons_cache
          key: godot-double-api-${{ inputs.api_version }}-linux-x86_64

      - name: Build double-precision Godot editor
        shell: bash
        run: |
          set -euo pipefail
          cd godot
          scons \
            platform=linuxbsd \
            target=editor \
            precision=double \
            debug_symbols=no \
            scu_build=yes \
            accesskit=${{ steps.accesskit.outputs.enabled }} \
            cache_path="$PWD/.scons_cache" \
            -j2

      - name: Dump and verify double API
        shell: bash
        run: |
          set -euo pipefail
          cd godot

          engine="$(find bin -maxdepth 1 -type f -name 'godot.*.editor*.x86_64*' | head -n 1)"
          if [ -z "$engine" ]; then
            echo "Could not locate the double-precision Godot editor binary."
            exit 1
          fi

          chmod +x "$engine"
          "$engine" --headless --dump-extension-api

          mkdir -p ../double-api ../double-engine
          cp extension_api.json ../double-api/extension_api.json
          cp "$engine" ../double-engine/godot-double

          python - ../double-api/extension_api.json <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          precision = data.get("header", {}).get("precision")
          if precision != "double":
              raise SystemExit(f"Generated API has wrong precision: {precision!r}")
          print("Generated API precision:", precision)
          print("Generated API version:", data.get("header", {}).get("version_full_name"))
          PY

      - name: Upload double API
        uses: actions/upload-artifact@v4
        with:
          name: godot-extension-api-${{ inputs.api_version }}-double
          path: double-api/extension_api.json
          if-no-files-found: error
          retention-days: 2

      - name: Upload double Godot editor for smoke test
        uses: actions/upload-artifact@v4
        with:
          name: godot-editor-${{ inputs.api_version }}-double-linux-x86_64
          path: double-engine/godot-double
          if-no-files-found: error
          compression-level: 6
          retention-days: 2

  build:
    needs:
      - resolve
      - double_api
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        precision: [single, double]
        variant:
          - id: linux-x86_64-gcc
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
            compiler: gcc
            windows_compiler: msvc
            flags: ""
          - id: windows-x86_64-msvc
            os: windows-2022
            platform: windows
            arch: x86_64
            compiler: msvc
            windows_compiler: msvc
            flags: ""
          - id: windows-x86_64-mingw
            os: windows-2022
            platform: windows
            arch: x86_64
            compiler: mingw
            windows_compiler: mingw
            flags: "use_mingw=yes"
          - id: macos-universal-clang
            os: macos-latest
            platform: macos
            arch: universal
            compiler: clang
            windows_compiler: msvc
            flags: "arch=universal"
          - id: android-arm64
            os: ubuntu-22.04
            platform: android
            arch: arm64
            compiler: android-ndk
            windows_compiler: msvc
            flags: "arch=arm64"
          - id: ios-arm64
            os: macos-latest
            platform: ios
            arch: arm64
            compiler: apple-clang
            windows_compiler: msvc
            flags: "arch=arm64"
          - id: web-wasm32
            os: ubuntu-22.04
            platform: web
            arch: wasm32
            compiler: emscripten
            windows_compiler: msvc
            flags: "arch=wasm32"

    runs-on: ${{ matrix.variant.os }}

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout pinned upstream godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: ${{ needs.resolve.outputs.sha }}
          path: godot-cpp

      - name: Download genuine double-precision API
        if: ${{ matrix.precision == 'double' }}
        uses: actions/download-artifact@v4
        with:
          name: godot-extension-api-${{ inputs.api_version }}-double
          path: double-api

      - name: Install and verify double-precision API
        if: ${{ matrix.precision == 'double' }}
        shell: bash
        run: |
          set -euo pipefail
          api="${{ inputs.api_version }}"
          api="${api/./-}"
          destination="godot-cpp/gdextension/extension_api-${api}.json"
          cp double-api/extension_api.json "$destination"

          python - "$destination" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          precision = data.get("header", {}).get("precision")
          if precision != "double":
              raise SystemExit(f"Expected double API, got: {precision!r}")
          print("Using genuine double-precision API")
          PY

      - name: Setup godot-cpp dependencies
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.variant.platform }}
          windows-compiler: ${{ matrix.variant.windows_compiler }}
          em-version: "4.0.11"
          scons-version: "4.4.0"

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: .scons_cache
          key: godot-cpp-${{ matrix.variant.id }}-${{ matrix.precision }}-${{ needs.resolve.outputs.sha }}-api${{ inputs.api_version }}

      - name: Build godot-cpp
        shell: bash
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache
        run: |
          set -euo pipefail
          cd godot-cpp
          for target in template_debug template_release; do
            scons \
              api_version="${{ inputs.api_version }}" \
              platform="${{ matrix.variant.platform }}" \
              arch="${{ matrix.variant.arch }}" \
              target="$target" \
              precision="${{ matrix.precision }}" \
              ${{ matrix.variant.flags }}
          done

      - name: Package prebuilt SDK
        shell: bash
        run: |
          mkdir -p dist
          python scripts/package.py \
            --source godot-cpp \
            --output "dist/godot-cpp-api-${{ inputs.api_version }}-${{ matrix.variant.id }}-${{ matrix.precision }}.zip" \
            --api-version "${{ inputs.api_version }}" \
            --godot-cpp-sha "${{ needs.resolve.outputs.sha }}" \
            --variant "${{ matrix.variant.id }}" \
            --compiler "${{ matrix.variant.compiler }}" \
            --platform "${{ matrix.variant.platform }}" \
            --arch "${{ matrix.variant.arch }}" \
            --precision "${{ matrix.precision }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-cpp-api-${{ inputs.api_version }}-${{ matrix.variant.id }}-${{ matrix.precision }}
          path: dist/*.zip
          if-no-files-found: error

  smoke:
    name: Smoke test Linux ${{ matrix.precision }} package
    needs:
      - resolve
      - double_api
      - build
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        precision:
          - single
          - double

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install SCons
        shell: bash
        run: python -m pip install "scons==4.4.0"

      - name: Download Linux prebuilt package
        uses: actions/download-artifact@v4
        with:
          name: godot-cpp-api-${{ inputs.api_version }}-linux-x86_64-gcc-${{ matrix.precision }}
          path: smoke-package

      - name: Extract package into smoke fixture
        shell: bash
        run: |
          set -euo pipefail
          package="$(find smoke-package -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$package" ]; then
            echo "Prebuilt package ZIP was not found."
            exit 1
          fi

          rm -rf smoke-test/godot-cpp smoke-sdk
          mkdir -p smoke-sdk
          unzip -q "$package" -d smoke-sdk
          mv smoke-sdk/godot-cpp smoke-test/godot-cpp

      - name: Build tiny GDExtension against prebuilt package
        shell: bash
        run: |
          set -euo pipefail
          cd smoke-test
          scons \
            api_version="${{ inputs.api_version }}" \
            platform=linux \
            arch=x86_64 \
            target=template_debug \
            precision="${{ matrix.precision }}" \
            build_library=no \
            -j2

          library="$(find project/bin -maxdepth 1 -type f -name 'libsmoke*.so' | head -n 1)"
          if [ -z "$library" ]; then
            echo "Smoke GDExtension library was not produced."
            exit 1
          fi

          filename="$(basename "$library")"
          cat > project/smoke.gdextension <<EOF
          [configuration]
          entry_symbol = "smoke_library_init"
          compatibility_minimum = "${{ inputs.api_version }}"
          reloadable = false

          [libraries]
          linux.debug.x86_64 = "res://bin/$filename"
          EOF

      - name: Download official single-precision Godot
        if: ${{ matrix.precision == 'single' }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${{ inputs.api_version }}-stable/Godot_v${{ inputs.api_version }}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 "$url" --output godot-single.zip
          unzip -q godot-single.zip -d godot-single
          engine="$(find godot-single -type f -name 'Godot_v*-stable_linux.x86_64' | head -n 1)"
          if [ -z "$engine" ]; then
            echo "Official Godot executable was not found."
            exit 1
          fi
          chmod +x "$engine"
          echo "SMOKE_GODOT=$PWD/$engine" >> "$GITHUB_ENV"

      - name: Download double-precision Godot
        if: ${{ matrix.precision == 'double' }}
        uses: actions/download-artifact@v4
        with:
          name: godot-editor-${{ inputs.api_version }}-double-linux-x86_64
          path: godot-double

      - name: Select double-precision Godot
        if: ${{ matrix.precision == 'double' }}
        shell: bash
        run: |
          set -euo pipefail
          engine="$PWD/godot-double/godot-double"
          chmod +x "$engine"
          echo "SMOKE_GODOT=$engine" >> "$GITHUB_ENV"

      - name: Load smoke GDExtension in Godot
        shell: bash
        run: |
          set -euo pipefail
          "$SMOKE_GODOT" --headless --path smoke-test/project --editor --quit
          "$SMOKE_GODOT" --headless --path smoke-test/project --quit-after 2

  release:
    if: ${{ inputs.publish_release }}
    needs:
      - resolve
      - build
      - smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: godot-cpp-api-*
          merge-multiple: true

      - name: Make manifest
        run: |
          python scripts/make_manifest.py dist \
            --api-version "${{ inputs.api_version }}" \
            --godot-cpp-sha "${{ needs.resolve.outputs.sha }}" \
            --output dist/manifest.json

      - name: Choose release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="api-${{ inputs.api_version }}-${{ needs.resolve.outputs.short_sha }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "godot-cpp API ${{ inputs.api_version }} · ${{ needs.resolve.outputs.short_sha }}" \
              --notes "Prebuilt godot-cpp packages for the upstream-supported SCons platform/toolchain matrix. Upstream revision: ${{ needs.resolve.outputs.sha }}. Double-precision packages use an API dumped from a real precision=double Godot build. Linux single/double packages passed the GDExtension build/load smoke test."
          fi

          gh release upload "$TAG" dist/*.zip dist/manifest.json --clobber
